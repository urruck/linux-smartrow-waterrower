Builds:
  - versionName: 0.3.0
    versionCode: 300
    commit: v0.3.0
    subdir: mobile/android/app
    sudo:
      - apt-get update
      - apt-get install -y npm
    gradle:
      - yes
    build:
      - cd ../..
      - npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - node construire_www.mjs --android

